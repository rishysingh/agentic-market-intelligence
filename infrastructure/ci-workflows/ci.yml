name: Continuous Integration & Security Checks

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  backend-and-agent-tests:
    name: Backend, ADK Agents, MCP & Quant Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no committed secrets or credentials
        run: |
          PYTHONPATH=. python -m unittest discover -s tests/security -p "test_*.py" -v

      - name: Run Unit Tests (Contracts, Quant Math, Backtester, Agents)
        run: |
          PYTHONPATH=. python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run Integration & End-to-End Workflow Tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests/integration -p "test_*.py" -v
          PYTHONPATH=. python -m unittest discover -s tests/end_to_end -p "test_*.py" -v

  frontend-build-and-typecheck:
    name: Frontend TypeScript & Next.js Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type check & production build
        run: |
          npx tsc --noEmit
          npm run build

  terraform-validate:
    name: Infrastructure-as-Code Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format & Validate
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
